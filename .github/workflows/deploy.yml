name: Deploy Infrastructure

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  deploy:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # AWS Academy Learner Lab issues session credentials (~4h TTL).
      # Refresh AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, and AWS_SESSION_TOKEN
      # in GitHub repository secrets before each deploy session.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Install queryApi Lambda dependencies
        working-directory: lambdas/queryApi
        run: npm ci

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        working-directory: infra
        run: terraform init

      - name: Terraform Validate
        working-directory: infra
        run: terraform validate

      - name: Terraform Plan
        working-directory: infra
        env:
          TF_VAR_demo_user_password: ${{ secrets.DEMO_USER_PASSWORD }}
          TF_VAR_hf_token: ${{ secrets.HF_TOKEN }}
        run: terraform plan

      - name: Terraform Apply
        working-directory: infra
        env:
          TF_VAR_demo_user_password: ${{ secrets.DEMO_USER_PASSWORD }}
          TF_VAR_hf_token: ${{ secrets.HF_TOKEN }}
        run: terraform apply -auto-approve

      - name: Print outputs
        working-directory: infra
        run: terraform output
