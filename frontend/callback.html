<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Signing in…</title>
  <style>
    body { font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; background: #f0f2f5; margin: 0; }
    .msg { text-align: center; color: #6b7280; }
    .spinner { width: 32px; height: 32px; border: 3px solid #e5e7eb; border-top-color: #4f46e5; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="msg">
  <div class="spinner"></div>
  <p>Completing sign-in…</p>
</div>
<script src="/config.js"></script>
<script>
  const hash = window.location.hash.substring(1);
  const params = new URLSearchParams(hash);
  const accessToken = params.get("access_token");
  const idToken    = params.get("id_token");

  if (!accessToken || !idToken) {
    window.location.replace("/index.html");
  } else {
    localStorage.setItem("access_token", accessToken);

    // Decode JWT payload (base64url) to extract groups and email
    const payload = JSON.parse(atob(idToken.split(".")[1].replace(/-/g, "+").replace(/_/g, "/")));
    const rawGroups = payload["cognito:groups"] || [];
    const groups = Array.isArray(rawGroups) ? rawGroups : [rawGroups];
    const group = groups.includes("recruiters") ? "recruiters" : "students";

    localStorage.setItem("user_group", group);
    localStorage.setItem("user_email", payload.email || payload["cognito:username"] || "");

    window.location.replace(group === "recruiters" ? "/office.html" : "/student.html");
  }
</script>
</body>
</html>
