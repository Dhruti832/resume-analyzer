<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resume Analyzer — Student</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f0f2f5; min-height: 100vh; }
    nav { background: #fff; border-bottom: 1px solid #e5e7eb; padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 100; }
    nav .brand { font-weight: 700; color: #1a1a2e; font-size: 1rem; display: flex; align-items: center; gap: 8px; }
    nav .brand svg { color: #4f46e5; }
    nav .nav-right { display: flex; align-items: center; gap: 8px; }

    /* Avatar button */
    .nav-avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg,#6366f1,#8b5cf6); color: #fff; font-weight: 700; font-size: 0.9rem; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; flex-shrink: 0; transition: box-shadow 0.15s; }
    .nav-avatar:hover { box-shadow: 0 0 0 3px #e0e7ff; }

    /* Logout icon button */
    .nav-logout { width: 36px; height: 36px; border-radius: 8px; background: none; border: 1px solid #e5e7eb; color: #6b7280; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background 0.15s, color 0.15s; }
    .nav-logout:hover { background: #fff1f2; border-color: #fca5a5; color: #dc2626; }

    /* Profile dropdown */
    .profile-dropdown { position: absolute; top: 60px; right: 24px; width: 260px; background: #fff; border-radius: 14px; box-shadow: 0 8px 32px rgba(0,0,0,0.12), 0 2px 8px rgba(0,0,0,0.06); border: 1px solid #e5e7eb; padding: 0; overflow: hidden; display: none; z-index: 200; }
    .profile-dropdown.open { display: block; animation: dropIn 0.15s ease; }
    @keyframes dropIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
    .pd-header { background: linear-gradient(135deg,#6366f1,#8b5cf6); padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .pd-avatar-lg { width: 56px; height: 56px; border-radius: 50%; background: rgba(255,255,255,0.25); color: #fff; font-weight: 800; font-size: 1.4rem; display: flex; align-items: center; justify-content: center; border: 2px solid rgba(255,255,255,0.5); }
    .pd-name { color: #fff; font-weight: 700; font-size: 0.92rem; text-align: center; word-break: break-all; }
    .pd-role { display: inline-flex; align-items: center; gap: 4px; background: rgba(255,255,255,0.2); color: #fff; font-size: 0.72rem; font-weight: 600; padding: 3px 10px; border-radius: 20px; }
    .pd-body { padding: 10px; }
    .pd-row { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; font-size: 0.83rem; color: #374151; }
    .pd-row svg { color: #9ca3af; flex-shrink: 0; }
    .pd-row.danger { color: #dc2626; cursor: pointer; }
    .pd-row.danger svg { color: #dc2626; }
    .pd-row.danger:hover { background: #fff1f2; }
    .pd-divider { height: 1px; background: #f3f4f6; margin: 4px 10px; }
    .page { max-width: 1200px; margin: 32px auto; padding: 0 16px; }

    /* Tabs */
    .tabs { display: flex; gap: 2px; margin: 0 auto 20px; max-width: 680px; background: #e5e7eb; padding: 3px; border-radius: 10px; }
    .tab { flex: 1; padding: 9px; border: none; border-radius: 8px; font-size: 0.88rem; font-weight: 600; cursor: pointer; background: transparent; color: #6b7280; }
    .tab.active { background: #fff; color: #1a1a2e; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    .panel { display: none; }
    .panel.active { display: block; }

    /* Card */
    .card { background: #fff; border-radius: 14px; padding: 32px; box-shadow: 0 2px 16px rgba(0,0,0,0.07); margin-bottom: 16px; }
    h2 { font-size: 1.2rem; color: #1a1a2e; margin-bottom: 6px; }
    .sub { color: #6b7280; font-size: 0.88rem; margin-bottom: 22px; }
    label { display: block; font-size: 0.82rem; font-weight: 600; color: #374151; margin-bottom: 6px; margin-top: 14px; }
    label:first-of-type { margin-top: 0; }

    /* Analyze panel narrower than history, tabs stay fixed width */
    #panel-analyze { max-width: 680px; margin: 0 auto; }


    /* Job source toggle */
    .source-toggle { display: flex; gap: 8px; margin-bottom: 14px; }
    .source-btn { flex: 1; padding: 8px; border: 1px solid #d1d5db; border-radius: 8px; background: #fff; font-size: 0.83rem; font-weight: 600; color: #6b7280; cursor: pointer; }
    .source-btn.active { border-color: #4f46e5; background: #eff6ff; color: #4f46e5; }

    select, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.9rem;
      font-family: inherit;
    }
    select:focus, textarea:focus { outline: none; border-color: #4f46e5; }
    textarea { resize: vertical; min-height: 110px; }
    input[type=file] { width: 100%; padding: 10px; border: 2px dashed #d1d5db; border-radius: 8px; font-size: 0.88rem; cursor: pointer; }
    input[type=file]:hover { border-color: #6366f1; }

    button.primary { width: 100%; padding: 12px; background: #4f46e5; color: #fff; border: none; border-radius: 8px; font-size: 0.95rem; font-weight: 600; cursor: pointer; margin-top: 18px; }
    button.primary:hover:not(:disabled) { background: #4338ca; }
    button.primary:disabled { background: #9ca3af; cursor: not-allowed; }

    #status { margin-top: 14px; font-size: 0.88rem; color: #6b7280; min-height: 20px; }
    #status.error { color: #dc2626; }

    /* Score result */
    #result { margin-top: 20px; display: none; }
    .score-box { background: linear-gradient(135deg,#f0fdf4,#dcfce7); border: 1px solid #86efac; border-radius: 12px; padding: 20px; text-align: center; margin-bottom: 16px; }
    .score-box.mid { background: linear-gradient(135deg,#eff6ff,#dbeafe); border-color: #93c5fd; }
    .score-box.low { background: linear-gradient(135deg,#fef9f0,#fef3c7); border-color: #fcd34d; }
    .score-num { font-size: 3rem; font-weight: 800; color: #15803d; }
    .score-box.mid .score-num { color: #1d4ed8; }
    .score-box.low .score-num { color: #b45309; }
    .score-lbl { font-size: 0.75rem; color: #6b7280; text-transform: uppercase; letter-spacing: 0.06em; margin-top: 2px; }
    .section { margin-bottom: 14px; }
    .section h3 { font-size: 0.72rem; font-weight: 700; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 7px; }
    .summary { font-size: 0.9rem; color: #374151; line-height: 1.65; }
    .skills { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; border-radius: 20px; padding: 3px 10px; font-size: 0.78rem; font-weight: 500; }
    .cid { font-size: 0.7rem; color: #9ca3af; margin-top: 14px; padding-top: 12px; border-top: 1px solid #f3f4f6; word-break: break-all; }
    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
    .detail-box { border-radius: 10px; padding: 14px 16px; }
    .detail-box.green { background: #f0fdf4; border: 1px solid #86efac; }
    .detail-box.red { background: #fff1f2; border: 1px solid #fca5a5; }
    .detail-box.blue { background: #eff6ff; border: 1px solid #93c5fd; grid-column: 1 / -1; }
    .detail-box h3 { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
    .detail-box.green h3 { color: #15803d; }
    .detail-box.red h3 { color: #dc2626; }
    .detail-box.blue h3 { color: #1d4ed8; }
    .detail-box ul { list-style: none; padding: 0; }
    .detail-box ul li { font-size: 0.82rem; color: #374151; line-height: 1.5; padding: 3px 0; padding-left: 16px; position: relative; }
    .detail-box ul li::before { content: "•"; position: absolute; left: 4px; }
    .detail-box.green ul li::before { color: #16a34a; }
    .detail-box.red ul li::before { color: #dc2626; }
    .detail-box.blue ul li::before { color: #2563eb; }

    /* History — full width panel */
    .history-wrap { width: 100%; }
    .history-card { background: #fff; border-radius: 14px; box-shadow: 0 2px 16px rgba(0,0,0,0.07); margin-bottom: 20px; overflow: hidden; }
    .history-card-header { padding: 20px 24px 16px; border-bottom: 1px solid #f3f4f6; display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; }
    .history-card-header .job-name { font-size: 1.05rem; font-weight: 700; color: #1a1a2e; margin-bottom: 3px; }
    .history-card-header .hist-meta { font-size: 0.78rem; color: #9ca3af; }
    .hist-score-badge { text-align: center; min-width: 72px; }
    .hist-score-badge .score-num { font-size: 2.2rem; font-weight: 800; line-height: 1; }
    .hist-score-badge .score-lbl { font-size: 0.65rem; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.06em; }
    .hist-score-badge.hi .score-num { color: #15803d; }
    .hist-score-badge.mid .score-num { color: #1d4ed8; }
    .hist-score-badge.low .score-num { color: #b45309; }
    .btn-download { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; background: #f9fafb; border: 1px solid #d1d5db; border-radius: 8px; font-size: 0.8rem; font-weight: 600; color: #374151; cursor: pointer; text-decoration: none; margin-top: 6px; }
    .btn-download:hover { background: #eff6ff; border-color: #93c5fd; color: #1d4ed8; }

    /* Two-column body */
    .history-body { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
    .hist-col { padding: 20px 24px; }
    .hist-col + .hist-col { border-left: 1px solid #f3f4f6; }
    .hist-col-title { font-size: 0.68rem; font-weight: 700; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.09em; margin-bottom: 10px; }
    .hist-desc { font-size: 0.82rem; color: #374151; line-height: 1.6; white-space: pre-wrap; word-break: break-word; max-height: 200px; overflow-y: auto; }
    .hist-summary { font-size: 0.88rem; color: #374151; line-height: 1.65; margin-bottom: 14px; }

    /* Three-column analytics */
    .history-analytics { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; padding: 0 24px 20px; border-top: 1px solid #f3f4f6; padding-top: 16px; }
    .skills-row { padding: 0 24px 18px; border-top: 1px solid #f3f4f6; padding-top: 14px; }
    .empty { text-align: center; color: #9ca3af; padding: 40px 0; font-size: 0.9rem; }
    @media (max-width: 680px) {
      .history-body { grid-template-columns: 1fr; }
      .hist-col + .hist-col { border-left: none; border-top: 1px solid #f3f4f6; }
      .history-analytics { grid-template-columns: 1fr; }
    }

    .spinner { display: inline-block; width: 13px; height: 13px; border: 2px solid #d1d5db; border-top-color: #4f46e5; border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; margin-right: 5px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Toast notifications ── */
    .toast-container { position: fixed; top: 68px; right: 18px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
    .toast { display: flex; align-items: center; gap: 10px; padding: 11px 16px; border-radius: 10px; font-size: 0.84rem; font-weight: 500; box-shadow: 0 4px 20px rgba(0,0,0,0.13); min-width: 240px; max-width: 340px; pointer-events: all; animation: toastIn 0.22s ease; }
    .toast.success { background: #f0fdf4; border: 1px solid #86efac; color: #15803d; }
    .toast.error   { background: #fff1f2; border: 1px solid #fca5a5; color: #dc2626; }
    .toast.info    { background: #eff6ff; border: 1px solid #93c5fd; color: #1d4ed8; }
    .toast-icon { flex-shrink: 0; }
    .toast-msg { flex: 1; line-height: 1.4; }
    @keyframes toastIn { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: translateX(0); } }

    /* ── Analyze loader overlay ── */
    #analyze-loader { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 5000; align-items: center; justify-content: center; }
    #analyze-loader.show { display: flex; }
    .loader-box { background: #fff; border-radius: 16px; padding: 40px 48px; text-align: center; box-shadow: 0 8px 40px rgba(0,0,0,0.18); }
    .loader-ring { width: 56px; height: 56px; border: 5px solid #e0e7ff; border-top-color: #4f46e5; border-radius: 50%; animation: spin 0.85s linear infinite; margin: 0 auto 18px; }
    .loader-label { font-size: 0.95rem; font-weight: 600; color: #1a1a2e; }

    /* ── Skeleton loader ── */
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .skel { background: linear-gradient(90deg, #f3f4f6 25%, #eaecef 50%, #f3f4f6 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 6px; }
    .skel-card { background: #fff; border-radius: 14px; box-shadow: 0 2px 16px rgba(0,0,0,0.06); margin-bottom: 20px; padding: 24px; }
    .skel-line { height: 14px; margin-bottom: 10px; }
    .skel-line.wide { width: 60%; }
    .skel-line.half { width: 35%; }
    .skel-line.short { width: 20%; }
    .skel-score { width: 56px; height: 56px; border-radius: 8px; flex-shrink: 0; }
    .skel-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 18px; }
    .skel-body { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }

    /* ── Tablet responsive ── */
    @media (max-width: 768px) {
      .history-analytics { grid-template-columns: 1fr 1fr; }
      .detail-grid { grid-template-columns: 1fr; }
      .detail-box.blue { grid-column: auto; }
    }

    /* Pending / failed card states */
    .history-card.pending { border-left: 4px solid #a5b4fc; }
    .history-card.failed  { border-left: 4px solid #fca5a5; }
    .status-banner { display: flex; align-items: center; gap: 10px; padding: 18px 24px; }
    .status-banner .status-icon { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .status-banner .status-icon.pending { background: #ede9fe; color: #7c3aed; }
    .status-banner .status-icon.failed  { background: #fee2e2; color: #dc2626; }
    .status-banner .status-text { font-size: 0.88rem; color: #374151; }
    .status-banner .status-title { font-weight: 700; font-size: 0.95rem; color: #1a1a2e; margin-bottom: 2px; }
  </style>
</head>
<body>
<nav>
  <span class="brand">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
    AI Resume Analyzer
  </span>
  <div class="nav-right">
    <button class="nav-avatar" id="nav-avatar-btn" onclick="toggleProfile()" title="Profile">
      <span id="nav-initial">?</span>
    </button>
    <button class="nav-logout" onclick="logout()" title="Sign out">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </button>
  </div>

  <!-- Profile dropdown -->
  <div class="profile-dropdown" id="profile-dropdown">
    <div class="pd-header">
      <div class="pd-avatar-lg" id="pd-avatar-lg">?</div>
      <div class="pd-name" id="pd-email-full">—</div>
      <span class="pd-role">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Student
      </span>
    </div>
    <div class="pd-body">
      <div class="pd-row">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        <span id="pd-email-row" style="word-break:break-all;font-size:0.82rem;color:#6b7280;">—</span>
      </div>
      <div class="pd-divider"></div>
      <div class="pd-row danger" onclick="logout()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Sign out
      </div>
    </div>
  </div>
</nav>

<div class="toast-container" id="toast-container"></div>

<div class="page">
  <div class="tabs">
    <button class="tab active" onclick="switchTab('analyze', this)">Analyze Resume</button>
    <button class="tab" onclick="switchTab('history', this)">My History</button>
  </div>

  <!-- ANALYZE TAB -->
  <div id="panel-analyze" class="panel active">
    <div class="card">
      <h2>Analyze Your Resume</h2>
      <p class="sub">Provide the job description and your resume, and we'll score your fit.</p>

      <label>Job Description</label>
      <div class="source-toggle">
        <button class="source-btn active" id="btn-pdf" onclick="setSource('pdf')">Upload Job PDF</button>
        <button class="source-btn" id="btn-custom" onclick="setSource('custom')">Paste Description</button>
      </div>

      <div id="src-pdf">
        <input type="file" id="job-pdf" accept="application/pdf" />
        <div id="job-pdf-status" style="font-size:0.78rem;color:#6b7280;margin-top:6px;min-height:16px;"></div>
      </div>

      <div id="src-custom" style="display:none">
        <textarea id="job-desc" placeholder="Paste the job description here…" style="height:180px"></textarea>
      </div>

      <label for="resume">Your Resume (PDF)</label>
      <input type="file" id="resume" accept="application/pdf" />

      <button class="primary" id="btn-analyze" onclick="analyze()">Analyze Resume</button>
      <div id="status"></div>
      <div id="result"></div>
    </div>
  </div>

  <!-- HISTORY TAB -->
  <div id="panel-history" class="panel">
    <div class="history-wrap">
      <div id="history-list"><div class="empty"><span class="spinner"></span> Loading…</div></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module" id="pdfjs-script"></script>
<script src="/config.js"></script>
<script>
  const token = localStorage.getItem("access_token");
  if (!token) { window.location.replace("/index.html"); }

  // Populate profile avatar & dropdown
  const userEmail = localStorage.getItem("user_email") || "";
  const initial = (userEmail[0] || "?").toUpperCase();
  document.getElementById("nav-initial").textContent = initial;
  document.getElementById("pd-avatar-lg").textContent = initial;
  document.getElementById("pd-email-full").textContent = userEmail;
  document.getElementById("pd-email-row").textContent = userEmail;

  function toggleProfile() {
    document.getElementById("profile-dropdown").classList.toggle("open");
  }
  document.addEventListener("click", (e) => {
    if (!e.target.closest("#nav-avatar-btn") && !e.target.closest("#profile-dropdown")) {
      document.getElementById("profile-dropdown").classList.remove("open");
    }
  });

  const API = window.APP_CONFIG.apiBase;
  let jobSource = "pdf";

  // ── Tab switching ─────────────────────────────────────────────────────────
  function switchTab(name, el) {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
    el.classList.add("active");
    document.getElementById("panel-" + name).classList.add("active");
    if (name === "history") loadHistory();
  }

  // ── Job source toggle ─────────────────────────────────────────────────────
  function setSource(src) {
    jobSource = src;
    document.getElementById("btn-pdf").classList.toggle("active", src === "pdf");
    document.getElementById("btn-custom").classList.toggle("active", src === "custom");
    document.getElementById("src-pdf").style.display = src === "pdf" ? "" : "none";
    document.getElementById("src-custom").style.display = src === "custom" ? "" : "none";
  }

  // Show filename when job PDF is picked
  document.addEventListener("DOMContentLoaded", () => {
    document.getElementById("job-pdf").addEventListener("change", (e) => {
      const f = e.target.files[0];
      document.getElementById("job-pdf-status").textContent = f ? `Selected: ${f.name}` : "";
    });
  });

  // ── Extract text from a PDF file using pdf.js ─────────────────────────────
  async function extractPdfText(file) {
    const PDFJS_CDN = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs";
    const { getDocument, GlobalWorkerOptions } = await import(PDFJS_CDN);
    GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";
    const arrayBuffer = await file.arrayBuffer();
    const pdf = await getDocument({ data: arrayBuffer }).promise;
    const pages = [];
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      pages.push(content.items.map(item => item.str).join(" "));
    }
    return pages.join("\n").trim();
  }

  // ── Toast ─────────────────────────────────────────────────────────────────
  function showToast(message, type = "info", duration = 4000) {
    const icons = {
      success: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
      error:   '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',
      info:    '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>',
    };
    const t = document.createElement("div");
    t.className = `toast ${type}`;
    t.innerHTML = `<span class="toast-icon">${icons[type]}</span><span class="toast-msg">${message}</span>`;
    document.getElementById("toast-container").appendChild(t);
    setTimeout(() => { t.style.opacity = "0"; t.style.transition = "opacity 0.3s"; setTimeout(() => t.remove(), 320); }, duration);
  }

  // ── Analyze loader ────────────────────────────────────────────────────────
  function setStep(n) {
    const labels = { 1: "Uploading resume…", 2: "Extracting text…", 3: "Scoring with AI…", 4: "Completing…" };
    document.getElementById("loader-label").textContent = labels[n] || "Analyzing your resume…";
    document.getElementById("analyze-loader").classList.add("show");
  }
  function hideSteps() { document.getElementById("analyze-loader").classList.remove("show"); }

  // ── Analyze ───────────────────────────────────────────────────────────────
  async function analyze() {
    const file = document.getElementById("resume").files[0];
    if (!file) { showToast("Please select a resume PDF.", "error"); return; }
    if (file.type !== "application/pdf") { showToast("Only PDF files are supported.", "error"); return; }

    let jobDescription = null;

    if (jobSource === "pdf") {
      const jobFile = document.getElementById("job-pdf").files[0];
      if (!jobFile) { showToast("Please upload a job description PDF.", "error"); return; }
      setStatus('<span class="spinner"></span>Reading job description PDF…');
      try {
        jobDescription = await extractPdfText(jobFile);
        if (!jobDescription) throw new Error("Could not extract text from PDF.");
      } catch (e) { setStatus(""); showToast("Job PDF error: " + e.message, "error"); return; }
    } else {
      jobDescription = document.getElementById("job-desc").value.trim();
      if (!jobDescription) { showToast("Please paste a job description.", "error"); return; }
    }

    const btn = document.getElementById("btn-analyze");
    btn.disabled = true;
    document.getElementById("result").style.display = "none";
    setStatus("");
    setStep(1);

    let info;
    try {
      const res = await fetch(`${API}/upload`, {
        method: "POST",
        headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
        body: JSON.stringify({ jobDescription }),
      });
      if (res.status === 401 || res.status === 403) { logout(); return; }
      if (!res.ok) throw new Error(`API ${res.status}`);
      info = await res.json();
    } catch (e) { hideSteps(); showToast("Error: " + e.message, "error"); btn.disabled = false; return; }

    try {
      const put = await fetch(info.uploadUrl, { method: "PUT", body: file, headers: { "Content-Type": "application/pdf" } });
      if (!put.ok) throw new Error(`S3 ${put.status}`);
    } catch (e) { hideSteps(); showToast("Upload failed: " + e.message, "error"); btn.disabled = false; return; }

    setStep(2);
    poll(info.candidateId, btn);
  }

  function poll(candidateId, btn) {
    const deadline = Date.now() + 5 * 60 * 1000;
    let lastStatus = "";
    const iv = setInterval(async () => {
      if (Date.now() > deadline) {
        clearInterval(iv);
        hideSteps();
        showToast("Timed out — check History tab in a minute.", "error");
        btn.disabled = false;
        return;
      }
      try {
        const res = await fetch(`${API}/results/${candidateId}`, { headers: { Authorization: `Bearer ${token}` } });
        if (res.status === 404) return;
        if (!res.ok) { clearInterval(iv); hideSteps(); showToast("Error: " + res.status, "error"); btn.disabled = false; return; }
        const data = await res.json();
        if (data.status === "pending") {
          if (lastStatus !== "pending") { setStep(3); lastStatus = "pending"; }
          return;
        }
        if (data.status === "failed") {
          clearInterval(iv);
          hideSteps();
          showToast("Analysis failed — please try again.", "error");
          btn.disabled = false;
          return;
        }
        clearInterval(iv);
        setStep(4);
        setTimeout(() => { hideSteps(); showResult(data, candidateId); btn.disabled = false; }, 700);
      } catch (_) {}
    }, 5000);
  }

  function showResult(d, candidateId) {
    const s = d.matchScore || 0;
    const cls = s >= 70 ? "" : s >= 40 ? "mid" : "low";
    const li = (arr) => (arr || []).map(x => `<li>${esc(x)}</li>`).join("");
    document.getElementById("result").style.display = "block";
    document.getElementById("result").innerHTML = `
      <div class="score-box ${cls}"><div class="score-num">${s}</div><div class="score-lbl">Match Score / 100</div></div>
      ${d.summary ? `<div class="section"><h3>Summary</h3><p class="summary">${esc(d.summary)}</p></div>` : ""}
      ${(d.strengths?.length || d.gaps?.length) ? `
      <div class="detail-grid">
        ${d.strengths?.length ? `<div class="detail-box green"><h3>✓ Strengths</h3><ul>${li(d.strengths)}</ul></div>` : ""}
        ${d.gaps?.length ? `<div class="detail-box red"><h3>✗ Gaps</h3><ul>${li(d.gaps)}</ul></div>` : ""}
        ${d.recommendations?.length ? `<div class="detail-box blue"><h3>→ Recommendations</h3><ul>${li(d.recommendations)}</ul></div>` : ""}
      </div>` : ""}
      ${d.skills?.length ? `<div class="section"><h3>Skills Detected</h3><div class="skills">${d.skills.map(sk=>`<span class="tag">${esc(sk)}</span>`).join("")}</div></div>` : ""}
      <div class="cid">Candidate ID: ${esc(candidateId)}</div>`;
  }

  // ── History ───────────────────────────────────────────────────────────────
  function skeletonCards(n = 3) {
    return Array.from({ length: n }, () => `
      <div class="skel-card">
        <div class="skel-header"></div>
        <div class="skel-body">
          <div class="skel skel-line lg" style="width:55%;margin-bottom:10px"></div>
          <div class="skel skel-line md" style="width:80%"></div>
          <div class="skel skel-line md" style="width:65%"></div>
        </div>
      </div>`).join("");
  }

  async function loadHistory() {
    const el = document.getElementById("history-list");
    el.innerHTML = skeletonCards(3);
    try {
      const res = await fetch(`${API}/my-results`, { headers: { Authorization: `Bearer ${token}` } });
      if (!res.ok) { el.innerHTML = '<div class="empty">Could not load history.</div>'; return; }
      const data = await res.json();
      const items = data.items ?? data;
      if (!items.length) {
        el.innerHTML = '<div class="empty">No analyses yet — go to Analyze Resume to get started.</div>';
        return;
      }

      el.innerHTML = items.map((r) => {
        const date = r.createdAt
          ? new Date(r.createdAt).toLocaleDateString("en-CA", { month: "long", day: "numeric", year: "numeric", hour: "2-digit", minute: "2-digit" })
          : "";
        const jobTitle = esc(r.jobTitle || "General Analysis");

        // ── Pending card ──────────────────────────────────────────────────────
        if (r.status === "pending") {
          return `
          <div class="history-card pending">
            <div class="status-banner">
              <div class="status-icon pending">
                <span class="spinner" style="width:18px;height:18px;border-width:2.5px;margin:0"></span>
              </div>
              <div class="status-text">
                <div class="status-title">${jobTitle}</div>
                Analysis in progress — this usually takes 30–60 seconds.
                ${date ? `<span style="color:#9ca3af;font-size:0.78rem"> · Submitted ${date}</span>` : ""}
              </div>
            </div>
          </div>`;
        }

        // ── Failed card ───────────────────────────────────────────────────────
        if (r.status === "failed") {
          return `
          <div class="history-card failed">
            <div class="status-banner">
              <div class="status-icon failed">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
              </div>
              <div class="status-text">
                <div class="status-title">${jobTitle}</div>
                Analysis failed — please try uploading your resume again.
                ${date ? `<span style="color:#9ca3af;font-size:0.78rem"> · Submitted ${date}</span>` : ""}
              </div>
            </div>
          </div>`;
        }

        // ── Completed card (default) ──────────────────────────────────────────
        const s = r.matchScore || 0;
        const cls = s >= 70 ? "hi" : s >= 40 ? "mid" : "low";
        const li = (arr) => (arr || []).map(x => `<li>${esc(x)}</li>`).join("");
        const jobDesc = r.jobDescription || "";
        const jobSkills = (r.jobRequiredSkills || []);
        const hasAnalytics = r.strengths?.length || r.gaps?.length || r.recommendations?.length;

        return `
        <div class="history-card">
          <div class="history-card-header">
            <div>
              <div class="job-name">${jobTitle}</div>
              <div class="hist-meta">Analyzed ${date}${r.jobLocation ? " &nbsp;·&nbsp; " + esc(r.jobLocation) : ""}</div>
              ${jobSkills.length ? `<div style="margin-top:6px;display:flex;flex-wrap:wrap;gap:4px">${jobSkills.map(sk=>`<span class="tag" style="font-size:0.72rem;padding:2px 8px">${esc(sk)}</span>`).join("")}</div>` : ""}
              ${r.downloadUrl ? `<a class="btn-download" href="${r.downloadUrl}" target="_blank" rel="noopener">⬇ Download Resume PDF</a>` : ""}
            </div>
            <div class="hist-score-badge ${cls}">
              <div class="score-num">${s}</div>
              <div class="score-lbl">/ 100</div>
            </div>
          </div>
          <div class="history-body">
            <div class="hist-col">
              <div class="hist-col-title">Job Post</div>
              ${jobDesc
                ? `<div class="hist-desc">${esc(jobDesc)}</div>`
                : `<div class="hist-desc" style="color:#9ca3af;font-style:italic">Job description not available</div>`}
            </div>
            <div class="hist-col">
              <div class="hist-col-title">Summary</div>
              ${r.summary ? `<p class="hist-summary">${esc(r.summary)}</p>` : ""}
              ${r.skills?.length ? `<div class="hist-col-title" style="margin-top:10px">Skills Detected</div><div class="skills">${r.skills.map(sk=>`<span class="tag">${esc(sk)}</span>`).join("")}</div>` : ""}
            </div>
          </div>
          ${hasAnalytics ? `
          <div class="history-analytics">
            <div class="detail-box green"><h3>✓ Strengths</h3><ul>${li(r.strengths)}</ul></div>
            <div class="detail-box red" style="grid-column:auto"><h3>✗ Gaps</h3><ul>${li(r.gaps)}</ul></div>
            <div class="detail-box blue" style="grid-column:auto"><h3>→ Recommendations</h3><ul>${li(r.recommendations)}</ul></div>
          </div>` : ""}
        </div>`;
      }).join("");
    } catch (e) { el.innerHTML = '<div class="empty">Error loading history.</div>'; }
  }

  // ── Helpers ───────────────────────────────────────────────────────────────
  function setStatus(html, err = false) { const el = document.getElementById("status"); el.innerHTML = html; el.className = err ? "error" : ""; }
  function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function logout() {
    localStorage.clear();
    const { cognitoLoginUrl, cognitoClientId, frontendBase } = window.APP_CONFIG;
    window.location.replace(`${cognitoLoginUrl}/logout?client_id=${cognitoClientId}&logout_uri=${encodeURIComponent(frontendBase + "/index.html")}`);
  }
</script>

<div id="analyze-loader">
  <div class="loader-box">
    <div class="loader-ring"></div>
    <div class="loader-label" id="loader-label">Analyzing your resume…</div>
  </div>
</div>
</body>
</html>
