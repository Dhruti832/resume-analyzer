<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resume Analyzer — Student</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f0f2f5; min-height: 100vh; }
    nav { background: #fff; border-bottom: 1px solid #e5e7eb; padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between; }
    nav .brand { font-weight: 700; color: #1a1a2e; font-size: 1rem; }
    nav .user { font-size: 0.85rem; color: #6b7280; display: flex; align-items: center; gap: 12px; }
    nav .user button { background: none; border: 1px solid #d1d5db; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; color: #374151; }
    nav .user button:hover { background: #f9fafb; }
    .page { max-width: 560px; margin: 40px auto; padding: 0 16px; }
    .card { background: #fff; border-radius: 14px; padding: 36px; box-shadow: 0 2px 16px rgba(0,0,0,0.07); }
    h1 { font-size: 1.4rem; color: #1a1a2e; margin-bottom: 6px; }
    .sub { color: #6b7280; font-size: 0.88rem; margin-bottom: 24px; }
    label { display: block; font-size: 0.82rem; font-weight: 600; color: #374151; margin-bottom: 6px; }
    input[type=file] { width: 100%; padding: 10px; border: 2px dashed #d1d5db; border-radius: 8px; font-size: 0.88rem; cursor: pointer; margin-bottom: 14px; }
    input[type=file]:hover { border-color: #6366f1; }
    button.primary { width: 100%; padding: 12px; background: #4f46e5; color: #fff; border: none; border-radius: 8px; font-size: 0.95rem; font-weight: 600; cursor: pointer; }
    button.primary:hover:not(:disabled) { background: #4338ca; }
    button.primary:disabled { background: #9ca3af; cursor: not-allowed; }
    #status { margin-top: 16px; font-size: 0.88rem; color: #6b7280; min-height: 20px; }
    #status.error { color: #dc2626; }
    #result { margin-top: 22px; display: none; }
    .score-box { background: linear-gradient(135deg,#f0fdf4,#dcfce7); border: 1px solid #86efac; border-radius: 12px; padding: 20px; text-align: center; margin-bottom: 16px; }
    .score-box.mid { background: linear-gradient(135deg,#eff6ff,#dbeafe); border-color: #93c5fd; }
    .score-box.low { background: linear-gradient(135deg,#fef9f0,#fef3c7); border-color: #fcd34d; }
    .score-num { font-size: 3rem; font-weight: 800; color: #15803d; }
    .score-box.mid .score-num { color: #1d4ed8; }
    .score-box.low .score-num { color: #b45309; }
    .score-lbl { font-size: 0.75rem; color: #6b7280; text-transform: uppercase; letter-spacing: 0.06em; margin-top: 2px; }
    .section { margin-bottom: 14px; }
    .section h3 { font-size: 0.72rem; font-weight: 700; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 7px; }
    .summary { font-size: 0.9rem; color: #374151; line-height: 1.65; }
    .skills { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; border-radius: 20px; padding: 3px 10px; font-size: 0.78rem; font-weight: 500; }
    .cid { font-size: 0.7rem; color: #9ca3af; margin-top: 14px; padding-top: 12px; border-top: 1px solid #f3f4f6; word-break: break-all; }
    .spinner { display: inline-block; width: 13px; height: 13px; border: 2px solid #d1d5db; border-top-color: #4f46e5; border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; margin-right: 5px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<nav>
  <span class="brand">AI Resume Analyzer</span>
  <div class="user">
    <span id="nav-email"></span>
    <button onclick="logout()">Sign out</button>
  </div>
</nav>

<div class="page">
  <div class="card">
    <h1>Analyze Your Resume</h1>
    <p class="sub">Upload your PDF and get an AI-powered job match score in ~30 seconds.</p>

    <label for="resume">Resume (PDF only)</label>
    <input type="file" id="resume" accept="application/pdf" />
    <button class="primary" id="btn" onclick="analyze()">Analyze Resume</button>

    <div id="status"></div>
    <div id="result"></div>
  </div>
</div>

<script src="/config.js"></script>
<script>
  // Auth guard
  const token = localStorage.getItem("access_token");
  if (!token) {
    const { cognitoLoginUrl, cognitoClientId, frontendBase } = window.APP_CONFIG;
    window.location.replace(`${cognitoLoginUrl}/login?client_id=${cognitoClientId}&response_type=token&scope=openid+profile+email&redirect_uri=${encodeURIComponent(frontendBase + "/callback.html")}`);
  }
  document.getElementById("nav-email").textContent = localStorage.getItem("user_email") || "";

  const API = window.APP_CONFIG.apiBase;

  async function analyze() {
    const file = document.getElementById("resume").files[0];
    if (!file) { setStatus("Please select a PDF file.", true); return; }
    if (file.type !== "application/pdf") { setStatus("Only PDF files are supported.", true); return; }

    const btn = document.getElementById("btn");
    btn.disabled = true;
    document.getElementById("result").style.display = "none";
    setStatus('<span class="spinner"></span>Getting upload URL…');

    let info;
    try {
      const res = await fetch(`${API}/upload`, { method: "POST", headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" }, body: JSON.stringify({}) });
      if (res.status === 401 || res.status === 403) { logout(); return; }
      if (!res.ok) throw new Error(`API ${res.status}`);
      info = await res.json();
    } catch (e) { setStatus("Error: " + e.message, true); btn.disabled = false; return; }

    setStatus('<span class="spinner"></span>Uploading resume…');
    try {
      const put = await fetch(info.uploadUrl, { method: "PUT", body: file, headers: { "Content-Type": "application/pdf" } });
      if (!put.ok) throw new Error(`S3 ${put.status}`);
    } catch (e) { setStatus("Upload failed: " + e.message, true); btn.disabled = false; return; }

    setStatus('<span class="spinner"></span>Analyzing — usually 30–60 seconds…');
    poll(info.candidateId, btn);
  }

  function poll(candidateId, btn) {
    const deadline = Date.now() + 2 * 60 * 1000;
    const iv = setInterval(async () => {
      if (Date.now() > deadline) { clearInterval(iv); setStatus("Timed out. Try refreshing in a minute.", true); btn.disabled = false; return; }
      try {
        const res = await fetch(`${API}/results/${candidateId}`, { headers: { Authorization: `Bearer ${token}` } });
        if (res.status === 404) return;
        if (!res.ok) { clearInterval(iv); setStatus("Error: " + res.status, true); btn.disabled = false; return; }
        const data = await res.json();
        clearInterval(iv);
        setStatus("");
        showResult(data, candidateId);
        btn.disabled = false;
      } catch (_) {}
    }, 5000);
  }

  function showResult(d, candidateId) {
    const s = d.matchScore || 0;
    const cls = s >= 70 ? "" : s >= 40 ? "mid" : "low";
    document.getElementById("result").style.display = "block";
    document.getElementById("result").innerHTML = `
      <div class="score-box ${cls}"><div class="score-num">${s}</div><div class="score-lbl">Match Score / 100</div></div>
      ${d.summary ? `<div class="section"><h3>Summary</h3><p class="summary">${esc(d.summary)}</p></div>` : ""}
      ${d.skills?.length ? `<div class="section"><h3>Skills Detected</h3><div class="skills">${d.skills.map(s=>`<span class="tag">${esc(s)}</span>`).join("")}</div></div>` : ""}
      <div class="cid">Candidate ID: ${esc(candidateId)}</div>`;
  }

  function setStatus(html, err = false) { const el = document.getElementById("status"); el.innerHTML = html; el.className = err ? "error" : ""; }
  function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function logout() {
    localStorage.clear();
    const { cognitoLoginUrl, cognitoClientId, frontendBase } = window.APP_CONFIG;
    window.location.replace(`${cognitoLoginUrl}/logout?client_id=${cognitoClientId}&logout_uri=${encodeURIComponent(frontendBase + "/index.html")}`);
  }
</script>
</body>
</html>
