<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI Resume Analyzer</title>
  <style>
    body { font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; background: #f0f2f5; margin: 0; }
    .msg { text-align: center; color: #6b7280; }
    .spinner { width: 32px; height: 32px; border: 3px solid #e5e7eb; border-top-color: #4f46e5; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="msg">
  <div class="spinner"></div>
  <p>Signing you in…</p>
</div>
<script src="/config.js"></script>
<script>
  const token = localStorage.getItem("access_token");
  const group = localStorage.getItem("user_group");

  if (token) {
    window.location.replace(group === "recruiters" ? "/office.html" : "/student.html");
  } else {
    const { cognitoLoginUrl, cognitoClientId, frontendBase } = window.APP_CONFIG;
    const redirect = encodeURIComponent(frontendBase + "/callback.html");
    window.location.replace(
      `${cognitoLoginUrl}/login?client_id=${cognitoClientId}&response_type=token&scope=openid+profile+email&redirect_uri=${redirect}`
    );
  }
</script>
</body>
</html>
